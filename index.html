<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>OneDash</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;color:#fff;font-family:"Segoe UI","Selawik","Open Sans",sans-serif}
#top,#top2{position:absolute;left:130px;top:40px;height:76px}
#ava,#ava2{position:absolute;left:0;top:0;width:76px;height:76px;background:#0e7a0d center/cover no-repeat;display:flex;align-items:center;justify-content:center}
#ava svg,#ava2 svg{width:46px;height:46px}
#foot,#foot2{position:absolute;right:130px;bottom:48px;display:flex;align-items:baseline}
#dt,#dt2{font-size:22px;color:#9a9a9a;text-transform:uppercase;letter-spacing:1px;margin-right:26px}
#clk,#clk2{font-size:40px;font-weight:300}
#right,#right2{position:absolute;right:130px;top:40px;width:76px;height:76px}
#right svg,#right2 svg{width:76px;height:76px}
#tabs{position:absolute;left:130px;top:150px;display:flex}
.tab{font-size:54px;font-weight:200;color:#6e6e6e;margin-right:44px}
.tab.on{color:#b5b5b5}.tab.sel{color:#fff}
#view{position:absolute;left:0;top:240px;width:1920px;height:780px;overflow:hidden}
#strip{position:absolute;left:0;top:60px;width:4400px;height:700px;transition:transform .55s cubic-bezier(.22,.8,.2,1)}
.panel{position:absolute;top:0;height:700px}
.tile{position:absolute;overflow:hidden;background:#555}
#focus,#afocus,.ghost{position:absolute;border:3px solid #fff;box-sizing:border-box;box-shadow:0 14px 44px 6px rgba(0,0,0,.95);z-index:10;pointer-events:none}
#focus,#afocus{display:none}.ghost{z-index:9}
#top2,#right2,#foot2{z-index:5}
.im{position:absolute;left:50%;top:26px;width:80px;height:80px;margin-left:-40px}
.tile.live{background:transparent!important}.tile.live .ic{display:none}
.bgf{position:absolute;background:#000;z-index:-1}
.tag{position:absolute;left:16px;top:14px;padding:2px 12px;font-size:22px;font-weight:600}
.ic{position:absolute;left:0;right:0;top:28px;text-align:center;font-size:70px;font-weight:200;line-height:78px}
.ic svg{width:74px;height:74px}
.big .ic{top:52px}.big .ic svg{width:124px;height:124px}
.lab{z-index:9;position:absolute;left:0;bottom:0;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:rgba(0,0,0,.72);padding:8px 16px;font-size:24px;font-weight:300;transform:translateY(100%);transition:transform .16s ease-out}
.big .lab{font-size:30px;padding:10px 20px}
.tile.sel .lab{transform:translateY(0)}
.wm{position:absolute;right:30px;top:-20px;font-size:320px;font-weight:700;opacity:.22;line-height:1}
.prof{padding:14px 16px}
.av{width:84px;height:84px;background:#e8432e;position:relative;margin-bottom:12px}
.av:before,.av:after{content:"";position:absolute;top:28px;width:12px;height:12px;background:#fff}
.av:before{left:22px}.av:after{right:22px}
.pn{font-size:22px;font-weight:600}.pl{font-size:16px;color:#cfe8cf}
.pc{position:absolute;left:16px;bottom:12px;font-size:17px;line-height:1.2}
.pc b{display:block;font-size:40px;font-weight:300}
.lbl{position:absolute;font-size:19px;color:#aaa;letter-spacing:1px;text-transform:uppercase}
#apps{position:absolute;left:0;top:0;right:0;bottom:0;background:#141414;display:none;z-index:20}
#asb{position:absolute;left:0;top:0;bottom:0;width:385px;background:#000;display:none}
#ring{position:absolute;left:112px;top:640px}
#rpct{position:absolute;left:112px;width:160px;top:703px;text-align:center;font-size:32px;font-weight:300}
#rusd{position:absolute;left:112px;width:160px;top:745px;text-align:center;font-size:15px;color:#888}
#rfree{position:absolute;left:0;width:385px;top:826px;text-align:center;font-size:20px}
#ahead{position:absolute;top:232px;font-size:20px;line-height:26px;color:#bbb}
#ahead b{display:block;color:#fff;font-weight:600}
#aview{position:absolute;top:280px;height:600px;right:0;overflow:hidden}
#astrip{position:absolute;left:0;top:20px;width:8000px;height:560px;transition:transform .3s cubic-bezier(.22,.8,.2,1)}
#ui{position:absolute;left:0;top:0;width:1920px;height:1080px}
#ui,#apps{transform-origin:50% 50%;transition:transform .22s ease-out,opacity .22s ease-out}
.z-in{transform:scale(1.06);opacity:0}.z-out{transform:scale(.94);opacity:0}.nt0{transition:none!important}
.gh{visibility:hidden}
.nt{position:absolute;left:0;bottom:0;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:8px 16px;font-size:24px;font-weight:300;z-index:10}
.big .nt{font-size:30px;padding:10px 20px}
.lw{max-width:50%!important;white-space:normal!important;font-size:19px!important;line-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.big .lw{font-size:24px!important;line-height:28px}
#toast{position:absolute;right:130px;bottom:40px;max-width:900px;background:#c50f1f;padding:14px 22px;font-size:24px;display:none;z-index:30}
</style></head><body>
<div id="ui">
<div id="top"><div id="ava"></div></div>
<div id="foot"><div id="dt"></div><div id="clk"></div></div>
<div id="right"></div>
<div id="tabs"></div>
<div id="view"><div id="strip"></div></div>
</div>
<div id="apps"><div id="foot2"><div id="dt2"></div><div id="clk2"></div></div><div id="top2"><div id="ava2"></div></div><div id="right2"></div><div id="asb"><svg id="ring" viewBox="0 0 160 160" width="160" height="160"><circle cx="80" cy="80" r="70" fill="none" stroke="#1f1f1f" stroke-width="7"/><circle id="rfg" cx="80" cy="80" r="70" fill="none" stroke="#8ea3b3" stroke-width="7" transform="rotate(-90 80 80)" stroke-dasharray="0 440"/></svg><div id="rpct"></div><div id="rusd">usado</div><div id="rfree"></div></div><div id="ahead"><b>Instaladas</b>Recientes y A–Z</div><div id="aview"><div id="astrip"><div id="afocus"></div></div></div></div>
<div id="toast"></div>
<script>
// ===== CONFIGURA AQUÍ =====
// IDs de apps: abre "Mis apps" en el TV para ver los reales.
var APPS={
 netflix:{n:"Netflix",id:"11101200001",g:"N",bg:"#b20710"},
 youtube:{n:"YouTube",id:"111299001912",ic:"play",bg:"#4a4a4a"},
 prime:{n:"Prime Video",id:"3201512006785",g:"P",bg:"#00a2e8"},
 spotify:{n:"Spotify",id:"3201606009684",g:"S",bg:"#168a3f"},
 disney:{n:"Disney+",id:"3201901017640",g:"D+",bg:"#1b44c8"},
 plex:{n:"Plex",id:"3201512006963",g:"X",bg:"#b7790a"}
};
// Cambiar de fuente desde una app suele estar bloqueado en TVs Samsung 2017.
// Si encuentras un ID de app de fuentes en "Mis apps", ponlo en "id".
var SRC={
 h1:{n:"HDMI 1",type:"HDMI",num:1,id:""},h2:{n:"HDMI 2",type:"HDMI",num:2,id:""},h3:{n:"HDMI 3",type:"HDMI",num:3,id:""},
 cp:{n:"Video por componentes",type:"COMPONENT",num:1,id:""},av:{n:"Video compuesto",type:"AV",num:1,id:""},
 tv:{n:"TV por aire",type:"TV",num:1,id:""}
};
var SETTINGS_ID=""; // ID de la app de Ajustes del TV (búscala en "Mis apps")
var BROWSER_ID="org.tizen.browser"; // navegador del TV (verifica el ID en "Mis apps")
var STORE_ID="";                    // app de tienda de apps de Samsung (búscala en "Mis apps")
var PRESS=0.08; // grosor máximo del borde negro al pulsar OK (fracción del lado del tile)
var AR=3;       // filas por columna: los tiles se llenan primero hacia abajo
var SOUNDS={move:"sounds/move.wav",select:"sounds/select.wav",open:"sounds/open.wav",back:"sounds/back.wav",page:"sounds/page.wav"}; // reemplaza estos archivos por los tuyos
var VOLUME=0.6;
var HIDE=[];    // IDs de apps que NO quieres ver en Mis apps
var AVATAR="";      // ruta de una imagen dentro del proyecto, ej. "avatar.png"; vacío = icono genérico
// Banners de la derecha. Netflix y Prime no tienen API pública: puedes poner tu propia imagen (img) y texto.
// YouTube puede mostrar el video en tendencia si pones una API key gratuita de YouTube Data API v3.
var BANNERS=[{app:"netflix",color:"#b20710",title:"Sigue viendo en Netflix",img:""},
 {app:"youtube",color:"#c4302b",title:"Tendencias en YouTube",img:""},
 {app:"prime",color:"#00a2e8",title:"Novedades en Prime Video",img:""}];
var YT_KEY="",YT_REGION="CO";
var PREVIEW=true; // muestra la entrada en vivo en el tile grande (requiere API tvwindow; puede cambiar la fuente del TV)
var MENU_SOURCE_ID="";
var DEFAULT=["a:netflix","a:youtube","a:prime","s:h1","a:spotify","a:disney","s:h2","a:plex"];
// ==========================
var IC={
 monitor:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><path d="M6 10h36v22H6zM16 41h16M24 32v9"/></svg>',
 grid:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M6 6h16v16H6zM26 6h16v16H26zM6 26h16v16H6zM26 26h16v16H26z"/></svg>',
 play:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M14 8l26 16-26 16z"/></svg>',
 hdmi:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><path d="M6 14h36v12l-6 10H12L6 26zM16 20h16"/></svg>',
 tv:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><path d="M6 16h36v24H6zM16 6l8 10 8-10"/></svg>',
 av:'<svg viewBox="0 0 48 48" fill="#fff"><circle cx="12" cy="24" r="6"/><circle cx="24" cy="24" r="6"/><circle cx="36" cy="24" r="6"/></svg>',
 power:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.5"><path d="M24 6v18M14 13a16 16 0 1 0 20 0"/></svg>',
 user:'<svg viewBox="0 0 48 48" fill="#fff"><circle cx="24" cy="17" r="9"/><path d="M6 44c0-11 8-16 18-16s18 5 18 16z"/></svg>',
 gear:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><circle cx="24" cy="24" r="8"/><circle cx="24" cy="24" r="16" stroke-width="7" stroke-dasharray="6.28 6.28"/></svg>',
 rca:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><circle cx="24" cy="24" r="14"/><circle cx="24" cy="24" r="5" fill="#fff"/></svg>',
 store:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><path d="M10 16h28l-2 26H12zM17 16v-3a7 7 0 0 1 14 0v3"/></svg>',
 globe:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><circle cx="24" cy="24" r="17"/><path d="M7 24h34M24 7c-9 9-9 25 0 34M24 7c9 9 9 25 0 34"/></svg>'
};
var U=176,G="#0e7a0d",MARGIN=130,GAP=48;
var $=function(i){return document.getElementById(i)},apps=[],ai=0,mode="home";
function toast(t){restoreUI();var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display="none"},4500)}
function launch(id){if(!id){toast("Falta el ID de esta app: búscalo en Mis apps y ponlo en index.html.");return}
 try{tizen.application.launch(id,null,function(e){toast("No se pudo abrir: "+e.message)})}catch(e){toast("Solo funciona dentro del TV ("+id+")")}}
function exitApp(){try{tizen.application.getCurrentApplication().exit()}catch(e){}}
function setSource(s){
 if(s.menu&&MENU_SOURCE_ID){launch(MENU_SOURCE_ID);return}
 try{tizen.tvwindow.setSource({type:s.type,number:s.num},function(){},function(e){fallback(s,e.message)},"MAIN")}catch(e){fallback(s,"")}}
function fallback(s,m){var id=s.menu?MENU_SOURCE_ID:s.id;
 if(id)launch(id);else toast("Este TV no deja cambiar de fuente desde apps. Usa el botón SOURCE del control. "+(m||""))}
// ---- recientes (se guardan al lanzar desde OneDash) ----
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function hue(n){var h=0,i;for(i=0;i<n.length;i++)h+=n.charCodeAt(i);return h%360}
function stored(){try{return JSON.parse(localStorage.getItem("od_rec")||"[]")}catch(e){return[]}}
function catKey(id){for(var k in APPS)if(APPS[k].id==id)return"a:"+k;return"x:"+id}
function allKeys(){var o=[],k;for(k in APPS)o.push("a:"+k);for(k in SRC)o.push("s:"+k);for(k in SYS)o.push("y:"+k);apps.forEach(function(a){var c=catKey(a.id);if(c.charAt(0)=="x")o.push(c)});return o}
function getRec(){var all=allKeys(),out=[];stored().concat(DEFAULT).concat(all).forEach(function(k){if(all.indexOf(k)>=0&&out.indexOf(k)<0)out.push(k)});return out}
function record(k){if(!k)return;var r=stored().filter(function(x){return x!=k});r.unshift(k);try{localStorage.setItem("od_rec",JSON.stringify(r.slice(0,40)))}catch(e){}}
function ext(t,o){for(var x in o)t[x]=o[x];return t}
function appTile(k,o){var a=APPS[k];return ext({key:"a:"+k,n:a.n,id:a.id,bg:a.bg,g:a.g,ic:a.ic},o)}
function srcTile(k,o){var s=SRC[k];return ext({key:"s:"+k,n:s.n,src:s,ic:k=="cp"?"av":k=="av"?"rca":k=="tv"?"tv":"hdmi",bg:G},o)}
var SYS={settings:{n:"Ajustes",ic:"gear",act:"settings"},browser:{n:"Navegador",ic:"globe"},store:{n:"Tienda de apps",ic:"store"}};
function sysTile(k,o){var y=SYS[k];return ext({key:"y:"+k,n:y.n,ic:y.ic,act:y.act,id:k=="browser"?BROWSER_ID:k=="store"?STORE_ID:"",bg:G},o)}
function lc(t){return String(t.n).split(/\s+/).length>3?" lw":""}
function appById(id){for(var i=0;i<apps.length;i++)if(apps[i].id==id)return apps[i];return null}
function xTile(a,o){var n=a.name||"?";return ext({key:"x:"+a.id,n:n,id:a.id,img:a.iconPath,g:n.charAt(0).toUpperCase(),bg:"hsl("+hue(n)+",40%,26%)"},o)}
function ent(key,o){var c=key.charAt(0);return c=="a"?appTile(key.slice(2),o):c=="x"?xTile(appById(key.slice(2)),o):c=="y"?sysTile(key.slice(2),o):srcTile(key.slice(2),o)}
function vfill(l,R){l.forEach(function(t,i){t.c=Math.floor(i/R)+1;t.r=i%R+1;t.w=1;t.h=1});return l}
function homeTiles(){var r=getRec(),t=[ent(r[0],{c:1,r:1,w:4,h:2,lab:1,art:1})],i;
 for(i=1;i<=4;i++)t.push(ent(r[i],{c:i,r:3,w:1,h:1}));
 t.push({n:"Fuentes",ic:"monitor",act:"panel:2",bg:G,c:5,r:1,w:1,h:1},sysTile("settings",{c:5,r:2,w:1,h:1}),{n:"Mis apps",ic:"grid",act:"apps",bg:G,c:5,r:3,w:1,h:1});
 BANNERS.forEach(function(b,i){t.push({banner:1,key:"a:"+b.app,id:APPS[b.app].id,n:b.title,tag:APPS[b.app].n,color:b.color,img:b.img,c:6,r:i+1,w:2,h:1,nv:1})});return t}
var PANELS=[
 {name:"Marcas",cols:2,tiles:function(){return vfill(getRec().filter(function(k){return k.charAt(0)=="a"}).map(function(k){return appTile(k.slice(2),{})}),AR)}},
 {name:"Inicio",cols:7,tiles:homeTiles,label:{t:"Novedades",x:5*U+32,y:-38}},
 {name:"Fuentes",cols:4,tiles:function(){var l=getRec().filter(function(k){return k.charAt(0)=="s"}).map(function(k){return srcTile(k.slice(2),{})});
  return vfill(l.concat([sysTile("settings",{}),sysTile("browser",{}),sysTile("store",{}),
   {n:"Mis apps",ic:"grid",act:"apps",bg:G},{n:"Salir",ic:"power",act:"exit",bg:G}]),AR)}}
];
var PX=[],tiles=[],tabs=[],tops=[],panelEl=[],curPanel=1,cur=null;
function mkTile(t){var d=document.createElement("div");d.className="tile"+(t.w*t.h>=4?" big":"")+(t.prof?" prof":"");
 var l=(t.c-1)*U+(t.nv?32:0),w=t.w*U-8-(t.nv?32:0),bg;
 if(t.banner)bg=t.img?"linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,.05)),url("+t.img+") center/cover,"+t.color:"linear-gradient(135deg,"+t.color+",#151515)";
 else bg=(t.art&&!t.src?"radial-gradient(circle at 70% 35%,rgba(255,255,255,.3),rgba(0,0,0,.6) 90%),":"")+t.bg;
 d.style.cssText="left:"+l+"px;top:"+(t.r-1)*U+"px;width:"+w+"px;height:"+(t.h*U-8)+"px;background:"+bg;
 var h="";
 if(t.prof)h='<div class="av"></div><div class="pn">Mi TV</div><div class="pl">Samsung · Tizen</div><div class="pc"><b class="pclk"></b><span class="pcount">Mis apps</span></div>';
 else if(t.banner)h='<div class="tag" style="background:'+t.color+'">'+t.tag+'</div><div class="lab'+lc(t)+'">'+esc(t.n)+'</div>';
 else{if(t.art&&t.g)h+='<div class="wm">'+t.g+'</div>';
  else if(t.ic)h+='<div class="ic">'+IC[t.ic]+'</div>';else if(t.g&&!t.img)h+='<div class="ic">'+t.g+'</div>';
  h+=(!t.key||"sy".indexOf(t.key.charAt(0))>=0)?'<div class="lab'+lc(t)+'"><span class="gh">'+esc(t.n)+'</span></div><div class="nt'+lc(t)+'">'+esc(t.n)+'</div>':'<div class="lab'+lc(t)+'">'+esc(t.n)+'</div>'}
 d.innerHTML=h;
 if(t.img&&!t.art){var im=document.createElement("img");im.className="im";im.setAttribute("data-l",t.g||"?");
  im.onerror=function(){var q=document.createElement("div");q.className="ic";q.textContent=this.getAttribute("data-l");this.parentNode.replaceChild(q,this)};im.src=t.img;d.insertBefore(im,d.firstChild)}
 return d}
function buildPanel(p){var P=panelEl[p],old=tiles[p]||[];P.innerHTML="";var arr=[];
 if(PANELS[p].label){var L=document.createElement("div");L.className="lbl";L.textContent=PANELS[p].label.t;L.style.cssText="left:"+PANELS[p].label.x+"px;top:"+PANELS[p].label.y+"px";P.appendChild(L)}
 PANELS[p].tiles().forEach(function(t,i){t.w=t.w||1;t.h=t.h||1;var e=mkTile(t);P.appendChild(e);
  arr.push({kind:"tile",p:p,i:i,el:e,t:t,cx:PX[p]+(t.c-1)*U+t.w*U/2,cy:(t.r-1)*U+t.h*U/2})});
 tiles[p]=arr;tick();updCount();return arr}
function goPanel(p){if(p==curPanel)return;curPanel=p;$("strip").style.webkitTransform=$("strip").style.transform="translateX("+(MARGIN-PX[p])+"px)";tabsOn()}
function tabsOn(){tabs.forEach(function(t){t.el.className="tab"+(t.p==curPanel?" on":"")+(t==cur?" sel":"")})}
function frame(fid,sid,l,t,w,h){var f=$(fid);
 if(f.style.display=="block"){var g=f.cloneNode(false);g.removeAttribute("id");g.className="ghost";g.style.opacity=1;g.style.transition="opacity .25s";$(sid).appendChild(g);g.offsetWidth;g.style.opacity=0;
  setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g)},300)}
 if(w==null){f.style.display="none";return}
 f.style.display="block";f.style.left=(l-7)+"px";f.style.top=(t-7)+"px";f.style.width=(w+14)+"px";f.style.height=(h+14)+"px"}
function placeFocus(it){if(it.kind!="tile"){frame("focus","strip");return}
 var t=it.t,l=(t.c-1)*U+(t.nv?32:0),w=t.w*U-8-(t.nv?32:0);frame("focus","strip",PX[it.p]+l,(t.r-1)*U,w,t.h*U-8)}
var busy=0;
function pressFx(el){var p=document.createElement("div"),P=Math.round(Math.min(el.offsetWidth,el.offsetHeight)*PRESS);
 p.style.cssText="position:absolute;left:0;top:0;right:0;bottom:0;border:0 solid #000;box-sizing:border-box;z-index:5;pointer-events:none;transition:border-width .1s ease-in";
 el.appendChild(p);p.offsetWidth;p.style.borderWidth=P+"px";
 setTimeout(function(){p.style.transition="border-width .16s ease-out";p.style.borderWidth="0"},110);
 setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p)},320)}
function sel(it){if(cur&&cur.el)cur.el.classList.remove("sel");cur=it;it.el.classList.add("sel");if(it.kind!="top")goPanel(it.p);tabsOn();placeFocus(it);updatePreview()}
function near(c,dx,dy){var best=null,bd=1e9,pool=[];
 if(dx)tiles.forEach(function(a){pool=pool.concat(a)});else pool=tiles[c.p];
 pool.forEach(function(it){if(it==c)return;var x=it.cx-c.cx,y=it.cy-c.cy,m=dx?x*dx:y*dy,o=dx?Math.abs(y):Math.abs(x);
  if(m<=10)return;var d=m+o*2;if(d<bd){bd=d;best=it}});return best}
function move(dx,dy){var c=cur,n=null;
 if(c.kind=="tab"){if(dx)n=tabs[c.p+dx];else if(dy>0)n=tiles[c.p][0]}
 else{n=near(c,dx,dy);if(!n&&dy<0)n=tabs[c.p]}
 if(n){sfx(n.p!==curPanel?"page":"move");sel(n)}}
function run(t){if(t.src)setSource(t.src);else if(t.act=="settings"){if(SETTINGS_ID)launch(SETTINGS_ID);else toast("Falta el ID de Ajustes: búscalo en Mis apps y ponlo en SETTINGS_ID.")}else launch(t.id)}
function act(it){var t=it.t;if(!t)return;
 if(t.act=="apps")openApps();else if(t.act=="exit")exitApp();
 else if(t.act&&t.act.indexOf("panel:")==0)sel(tiles[+t.act.slice(6)][0]);

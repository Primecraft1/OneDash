<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>OneDash</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;color:#fff;font-family:"Segoe UI","Selawik","Open Sans",sans-serif}
#top{position:absolute;left:130px;top:40px;height:76px}
#ava{position:absolute;left:0;top:0;width:76px;height:76px;border-radius:50%;background:#0e7a0d center/cover no-repeat;display:flex;align-items:center;justify-content:center}
#ava svg{width:46px;height:46px}
#who{position:absolute;left:98px;top:2px;white-space:nowrap}
#clk{font-size:38px;font-weight:300;line-height:42px}
#dt{font-size:20px;color:#9bd29b;text-transform:uppercase;letter-spacing:1px}
#right{position:absolute;right:130px;top:40px;width:76px;height:76px}
#right svg{width:76px;height:76px}
#tabs{position:absolute;left:130px;top:150px;display:flex}
.tab{font-size:54px;font-weight:200;color:#6e6e6e;padding-bottom:4px;margin-right:44px;border-bottom:5px solid transparent}
.tab.on{color:#fff}.tab.sel{border-bottom-color:#107c10}
#view{position:absolute;left:0;top:240px;width:1920px;height:780px;overflow:hidden}
#strip{position:absolute;left:0;top:60px;width:4400px;height:700px;transition:transform .55s cubic-bezier(.22,.8,.2,1)}
.panel{position:absolute;top:0;height:700px}
.tile{position:absolute;overflow:hidden;background:#555}
#focus{position:absolute;display:none;border:6px solid #fff;box-sizing:border-box;box-shadow:0 14px 44px 6px rgba(0,0,0,.95);z-index:10;pointer-events:none}
.tile.live{background:transparent!important}.tile.live .ic{display:none}
.bgf{position:absolute;background:#232323;z-index:-1}
.tag{position:absolute;left:16px;top:14px;padding:2px 12px;font-size:22px;font-weight:600}
.ic{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:84px;font-weight:200;line-height:92px}
.ic svg{width:88px;height:88px}
.big .ic{top:62px}.big .ic svg{width:150px;height:150px}
.n{position:absolute;left:16px;bottom:12px;font-size:22px}
.lab{position:absolute;left:0;bottom:0;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:rgba(0,0,0,.72);padding:10px 22px;font-size:34px;font-weight:300}
.wm{position:absolute;right:30px;top:-20px;font-size:380px;font-weight:700;opacity:.22;line-height:1}
.prof{padding:14px 16px}
.av{width:100px;height:100px;background:#e8432e;position:relative;margin-bottom:12px}
.av:before,.av:after{content:"";position:absolute;top:34px;width:14px;height:14px;background:#fff}
.av:before{left:26px}.av:after{right:26px}
.pn{font-size:26px;font-weight:600}.pl{font-size:19px;color:#cfe8cf}
.pc{position:absolute;left:16px;bottom:12px;font-size:20px;line-height:1.2}
.pc b{display:block;font-size:48px;font-weight:300}
.lbl{position:absolute;font-size:19px;color:#aaa;letter-spacing:1px;text-transform:uppercase}
#apps{position:absolute;left:0;top:0;right:0;bottom:0;background:#101010f2;display:none;padding:60px 130px;z-index:20}
#apps h2{font-size:48px;font-weight:200;margin-bottom:24px}
#list{height:820px;overflow:hidden}
.it{display:inline-block;vertical-align:top;width:32.5%;margin:0 .6% 8px 0;padding:14px 20px;background:#2d2d2d;font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{display:block;font-size:18px;color:#999}.it.sel{background:#107c10}
#toast{position:absolute;right:130px;bottom:40px;max-width:900px;background:#c50f1f;padding:14px 22px;font-size:24px;display:none;z-index:30}
</style></head><body>
<div id="top"><div id="ava"></div><div id="who"><div id="clk"></div><div id="dt"></div></div></div>
<div id="right"></div>
<div id="tabs"></div>
<div id="view"><div id="strip"></div></div>
<div id="apps"><h2>Mis apps (el ID aparece bajo cada nombre)</h2><div id="list"></div></div>
<div id="toast"></div>
<script>
// ===== CONFIGURA AQUÍ =====
// IDs de apps: abre "Mis apps" en el TV para ver los reales.
var APPS={
 netflix:{n:"Netflix",id:"11101200001",g:"N",bg:"#b20710"},
 youtube:{n:"YouTube",id:"111299001912",ic:"play",bg:"#4a4a4a"},
 prime:{n:"Prime Video",id:"3201512006785",g:"P",bg:"#00a2e8"},
 spotify:{n:"Spotify",id:"3201606009684",g:"S",bg:"#168a3f"},
 disney:{n:"Disney+",id:"3201901017640",g:"D+",bg:"#1b44c8"},
 plex:{n:"Plex",id:"3201512006963",g:"X",bg:"#b7790a"}
};
// Cambiar de fuente desde una app suele estar bloqueado en TVs Samsung 2017.
// Si encuentras un ID de app de fuentes en "Mis apps", ponlo en "id".
var SRC={
 h1:{n:"HDMI 1",type:"HDMI",num:1,id:""},h2:{n:"HDMI 2",type:"HDMI",num:2,id:""},h3:{n:"HDMI 3",type:"HDMI",num:3,id:""},
 cp:{n:"Video por componentes",type:"COMPONENT",num:1,id:""},av:{n:"Video compuesto",type:"AV",num:1,id:""},
 tv:{n:"TV por aire",type:"TV",num:1,id:""}
};
var SETTINGS_ID=""; // ID de la app de Ajustes del TV (búscala en "Mis apps")
var AVATAR="";      // ruta de una imagen dentro del proyecto, ej. "avatar.png"; vacío = icono genérico
// Banners de la derecha. Netflix y Prime no tienen API pública: puedes poner tu propia imagen (img) y texto.
// YouTube puede mostrar el video en tendencia si pones una API key gratuita de YouTube Data API v3.
var BANNERS=[{app:"netflix",color:"#b20710",title:"Sigue viendo en Netflix",img:""},
 {app:"youtube",color:"#c4302b",title:"Tendencias en YouTube",img:""},
 {app:"prime",color:"#00a2e8",title:"Novedades en Prime Video",img:""}];
var YT_KEY="",YT_REGION="CO";
var PREVIEW=true; // muestra la entrada en vivo en el tile grande (requiere API tvwindow; puede cambiar la fuente del TV)
var MENU_SOURCE_ID="";
var DEFAULT=["a:netflix","a:youtube","a:prime","s:h1","a:spotify","a:disney","s:h2","a:plex"];
// ==========================
var IC={
 monitor:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><path d="M6 10h36v22H6zM16 41h16M24 32v9"/></svg>',
 grid:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M6 6h16v16H6zM26 6h16v16H26zM6 26h16v16H6zM26 26h16v16H26z"/></svg>',
 play:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M14 8l26 16-26 16z"/></svg>',
 hdmi:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><path d="M6 14h36v12l-6 10H12L6 26zM16 20h16"/></svg>',
 tv:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><path d="M6 16h36v24H6zM16 6l8 10 8-10"/></svg>',
 av:'<svg viewBox="0 0 48 48" fill="#fff"><circle cx="12" cy="24" r="6"/><circle cx="24" cy="24" r="6"/><circle cx="36" cy="24" r="6"/></svg>',
 power:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.5"><path d="M24 6v18M14 13a16 16 0 1 0 20 0"/></svg>',
 user:'<svg viewBox="0 0 48 48" fill="#fff"><circle cx="24" cy="17" r="9"/><path d="M6 44c0-11 8-16 18-16s18 5 18 16z"/></svg>',
 gear:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><circle cx="24" cy="24" r="8"/><circle cx="24" cy="24" r="16" stroke-width="7" stroke-dasharray="6.28 6.28"/></svg>',
 rca:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><circle cx="24" cy="24" r="14"/><circle cx="24" cy="24" r="5" fill="#fff"/></svg>',
 globe:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"><circle cx="24" cy="24" r="17"/><path d="M7 24h34M24 7c-9 9-9 25 0 34M24 7c9 9 9 25 0 34"/></svg>'
};
var U=208,G="#0e7a0d",MARGIN=130,GAP=48;
var $=function(i){return document.getElementById(i)},apps=[],ai=0,mode="home";
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display="none"},4500)}
function launch(id){if(!id){toast("Este mosaico no tiene ID de app. Edita index.html.");return}
 try{tizen.application.launch(id,null,function(e){toast("No se pudo abrir: "+e.message)})}catch(e){toast("Solo funciona dentro del TV ("+id+")")}}
function exitApp(){try{tizen.application.getCurrentApplication().exit()}catch(e){}}
function setSource(s){
 if(s.menu&&MENU_SOURCE_ID){launch(MENU_SOURCE_ID);return}
 try{tizen.tvwindow.setSource({type:s.type,number:s.num},function(){},function(e){fallback(s,e.message)},"MAIN")}catch(e){fallback(s,"")}}
function fallback(s,m){var id=s.menu?MENU_SOURCE_ID:s.id;
 if(id)launch(id);else toast("Este TV no deja cambiar de fuente desde apps. Usa el botón SOURCE del control. "+(m||""))}
// ---- recientes (se guardan al lanzar desde OneDash) ----
function allKeys(){var o=[],k;for(k in APPS)o.push("a:"+k);for(k in SRC)if(k!="menu")o.push("s:"+k);return o}
function getRec(){var s=[],all=allKeys(),out=[];try{s=JSON.parse(localStorage.getItem("od_rec")||"[]")}catch(e){}
 s.concat(DEFAULT).concat(all).forEach(function(k){if(all.indexOf(k)>=0&&out.indexOf(k)<0)out.push(k)});return out}
function record(k){if(!k)return;var r=getRec().filter(function(x){return x!=k});r.unshift(k);try{localStorage.setItem("od_rec",JSON.stringify(r.slice(0,20)))}catch(e){}}
function ext(t,o){for(var x in o)t[x]=o[x];return t}
function appTile(k,o){var a=APPS[k];return ext({key:"a:"+k,n:a.n,id:a.id,bg:a.bg,g:a.g,ic:a.ic},o)}
function srcTile(k,o){var s=SRC[k];return ext({key:"s:"+k,n:s.n,src:s,ic:k=="cp"?"av":k=="av"?"rca":k=="tv"?"tv":"hdmi",bg:G},o)}
function ent(key,o){return key.charAt(0)=="a"?appTile(key.slice(2),o):srcTile(key.slice(2),o)}
function homeTiles(){var r=getRec(),t=[{prof:1,act:"apps",bg:G,c:1,r:1,w:1,h:3},ent(r[0],{c:2,r:1,w:4,h:2,lab:1,art:1})],i;
 for(i=1;i<=4;i++)t.push(ent(r[i],{c:i+1,r:3,w:1,h:1}));
 t.push({n:"Fuentes",ic:"monitor",act:"panel:2",bg:G,c:6,r:1,w:1,h:1},{n:"Ajustes",ic:"gear",act:"settings",bg:G,c:6,r:2,w:1,h:1},{n:"Mis apps",ic:"grid",act:"apps",bg:G,c:6,r:3,w:1,h:1});
 BANNERS.forEach(function(b,i){t.push({banner:1,key:"a:"+b.app,id:APPS[b.app].id,n:b.title,tag:APPS[b.app].n,color:b.color,img:b.img,c:7,r:i+1,w:2,h:1,nv:1})});return t}
var PANELS=[
 {name:"Fijados",cols:6,tiles:function(){return[appTile("netflix",{c:1,r:1}),appTile("youtube",{c:2,r:1}),appTile("prime",{c:3,r:1}),
  appTile("spotify",{c:4,r:1}),appTile("disney",{c:5,r:1}),appTile("plex",{c:6,r:1})]}},
 {name:"Inicio",cols:8,tiles:homeTiles,label:{t:"Novedades",x:6*U+32,y:-38}},
 {name:"Fuentes",cols:6,tiles:function(){return[srcTile("h1",{c:1,r:1}),srcTile("h2",{c:2,r:1}),srcTile("h3",{c:3,r:1}),srcTile("cp",{c:4,r:1}),srcTile("av",{c:5,r:1}),srcTile("tv",{c:6,r:1}),
  {n:"Ajustes",ic:"gear",act:"settings",bg:G,c:1,r:2},{n:"Mis apps",ic:"grid",act:"apps",bg:G,c:2,r:2},{n:"Salir",ic:"power",act:"exit",bg:G,c:3,r:2}]}}
];
var PX=[],tiles=[],tabs=[],tops=[],panelEl=[],curPanel=1,cur=null;
function mkTile(t){var d=document.createElement("div");d.className="tile"+(t.w*t.h>=4?" big":"")+(t.prof?" prof":"");
 var l=(t.c-1)*U+(t.nv?32:0),w=t.w*U-8-(t.nv?32:0),bg;
 if(t.banner)bg=t.img?"linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,.05)),url("+t.img+") center/cover,"+t.color:"linear-gradient(135deg,"+t.color+",#151515)";
 else bg=(t.art&&!t.src?"radial-gradient(circle at 70% 35%,rgba(255,255,255,.3),rgba(0,0,0,.6) 90%),":"")+t.bg;
 d.style.cssText="left:"+l+"px;top:"+(t.r-1)*U+"px;width:"+w+"px;height:"+(t.h*U-8)+"px;background:"+bg;
 var h="";
 if(t.prof)h='<div class="av"></div><div class="pn">Mi TV</div><div class="pl">Samsung · Tizen</div><div class="pc"><b class="pclk"></b><span class="pcount">Mis apps</span></div>';
 else if(t.banner)h='<div class="tag" style="background:'+t.color+'">'+t.tag+'</div><div class="lab">'+t.n+'</div>';
 else{if(t.art&&t.g)h+='<div class="wm">'+t.g+'</div>';
  else if(t.ic)h+='<div class="ic">'+IC[t.ic]+'</div>';else if(t.g)h+='<div class="ic">'+t.g+'</div>';
  h+=t.lab?'<div class="lab">'+t.n+'</div>':'<div class="n">'+t.n+'</div>'}
 d.innerHTML=h;return d}
function buildPanel(p){var P=panelEl[p],old=tiles[p]||[];P.innerHTML="";var arr=[];
 if(PANELS[p].label){var L=document.createElement("div");L.className="lbl";L.textContent=PANELS[p].label.t;L.style.cssText="left:"+PANELS[p].label.x+"px;top:"+PANELS[p].label.y+"px";P.appendChild(L)}
 PANELS[p].tiles().forEach(function(t,i){t.w=t.w||1;t.h=t.h||1;var e=mkTile(t);P.appendChild(e);
  arr.push({kind:"tile",p:p,i:i,el:e,t:t,cx:PX[p]+(t.c-1)*U+t.w*U/2,cy:(t.r-1)*U+t.h*U/2})});
 tiles[p]=arr;tick();updCount();return arr}
function goPanel(p){if(p==curPanel)return;curPanel=p;$("strip").style.webkitTransform=$("strip").style.transform="translateX("+(MARGIN-PX[p])+"px)";tabsOn()}
function tabsOn(){tabs.forEach(function(t){t.el.className="tab"+(t.p==curPanel?" on":"")+(t==cur?" sel":"")})}
function placeFocus(it){var f=$("focus");if(it.kind!="tile"){f.style.display="none";return}
 var t=it.t,l=(t.c-1)*U+(t.nv?32:0),w=t.w*U-8-(t.nv?32:0);
 f.style.display="block";f.style.left=(PX[it.p]+l-10)+"px";f.style.top=((t.r-1)*U-10)+"px";f.style.width=(w+20)+"px";f.style.height=(t.h*U-8+20)+"px"}
function sel(it){cur=it;if(it.kind!="top")goPanel(it.p);tabsOn();placeFocus(it);updatePreview()}
function near(c,dx,dy){var best=null,bd=1e9,pool=[];
 if(dx)tiles.forEach(function(a){pool=pool.concat(a)});else pool=tiles[c.p];
 pool.forEach(function(it){if(it==c)return;var x=it.cx-c.cx,y=it.cy-c.cy,m=dx?x*dx:y*dy,o=dx?Math.abs(y):Math.abs(x);
  if(m<=10)return;var d=m+o*2;if(d<bd){bd=d;best=it}});return best}
function move(dx,dy){var c=cur,n=null;
 if(c.kind=="tab"){if(dx)n=tabs[c.p+dx];else if(dy>0)n=tiles[c.p][0]}
 else{n=near(c,dx,dy);if(!n&&dy<0)n=tabs[c.p]}
 if(n)sel(n)}
function act(it){var t=it.t;if(!t)return;
 if(t.act=="apps")openApps();else if(t.act=="exit")exitApp();
 else if(t.act=="settings"){if(SETTINGS_ID)launch(SETTINGS_ID);else toast("Falta el ID de Ajustes: búscalo en Mis apps y ponlo en SETTINGS_ID.")}
 else if(t.act&&t.act.indexOf("panel:")==0)sel(tiles[+t.act.slice(6)][0]);
 else{record(t.key);if(t.src)setSource(t.src);else launch(t.id)}}
function init(){PX=[];mkBg();var fo=document.createElement("div");fo.id="focus";$("strip").appendChild(fo);
 var av=$("ava");if(AVATAR)av.style.backgroundImage="url("+AVATAR+")";else av.innerHTML=IC.user;
 $("right").innerHTML=IC.monitor;
 var px=0;PANELS.forEach(function(P,p){PX[p]=px;px+=P.cols*U-8+GAP;
  var e=document.createElement("div");e.className="panel";e.style.cssText="left:"+PX[p]+"px;width:"+(P.cols*U-8)+"px";$("strip").appendChild(e);panelEl.push(e);
  var d=document.createElement("div");d.className="tab";d.textContent=P.name;$("tabs").appendChild(d);tabs.push({kind:"tab",p:p,el:d})});
 PANELS.forEach(function(P,p){buildPanel(p)});
 $("strip").style.webkitTransform=$("strip").style.transform="translateX("+(MARGIN-PX[curPanel])+"px)";
 sel(tiles[1][1])}
function refreshHome(){var idx=cur&&cur.kind=="tile"&&cur.p==1;buildPanel(1);if(idx)sel(tiles[1][1]);else updatePreview()}
function updCount(){var a=document.getElementsByClassName("pcount");for(var i=0;i<a.length;i++)if(apps.length)a[i].innerHTML=apps.length+" apps<br>instaladas"}
function loadApps(cb){try{tizen.application.getAppsInfo(function(a){apps=a.sort(function(x,y){return x.name.localeCompare(y.name)});updCount();cb&&cb()},function(e){cb&&cb(e.message)})}catch(e){cb&&cb("x")}}
function openApps(){stopPreview();mode="apps";$("apps").style.display="block";$("list").innerHTML="Cargando…";
 loadApps(function(err){if(err&&!apps.length)apps=[{name:"(prueba en PC)",id:"sin.tizen"}];ai=0;draw()})}
function draw(){var L=$("list");L.innerHTML="";apps.forEach(function(a,i){var d=document.createElement("div");d.className="it"+(i==ai?" sel":"");
 d.innerHTML=a.name+"<small>"+a.id+"</small>";L.appendChild(d)});var s=L.children[ai];if(s)L.scrollTop=Math.max(0,s.offsetTop-L.offsetTop-300)}
document.addEventListener("keydown",function(e){var k=e.keyCode;
 if(mode=="apps"){if(k==10009||k==8){mode="home";$("apps").style.display="none";updatePreview()}
  else if(k==13&&apps[ai])launch(apps[ai].id);
  else{var m={37:-1,39:1,38:-3,40:3}[k];if(m){ai=Math.max(0,Math.min(apps.length-1,ai+m));draw()}}return}
 if(k==37)move(-1,0);else if(k==39)move(1,0);else if(k==38)move(0,-1);else if(k==40)move(0,1);
 else if(k==13){if(cur.kind=="tab")move(0,1);else act(cur)}
 else if(k==10009||k==8){if(curPanel!=1)sel(tiles[1][1]);else exitApp()}});
document.addEventListener("visibilitychange",function(){if(document.hidden)stopPreview();else refreshHome()});
function tick(){var d=new Date(),h=d.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),a=document.getElementsByClassName("pclk"),i;
 $("clk").textContent=h;$("dt").textContent=d.toLocaleDateString("es-CO",{weekday:"short",day:"numeric",month:"short"});
 for(i=0;i<a.length;i++)a[i].textContent=h}
var bgs=[];
function mkBg(){if(typeof tizen==="undefined")document.documentElement.style.background="#232323";
 for(var i=0;i<4;i++){var d=document.createElement("div");d.className="bgf";document.body.insertBefore(d,document.body.firstChild);bgs.push(d)}setHole(null)}
function box(d,x,y,w,h){d.style.left=x+"px";d.style.top=y+"px";d.style.width=w+"px";d.style.height=h+"px"}
function setHole(r){if(!r){box(bgs[0],0,0,1920,1080);box(bgs[1],0,0,0,0);box(bgs[2],0,0,0,0);box(bgs[3],0,0,0,0);return}
 box(bgs[0],0,0,1920,r.y);box(bgs[1],0,r.y+r.h,1920,1080-r.y-r.h);box(bgs[2],0,r.y,r.x,r.h);box(bgs[3],r.x+r.w,r.y,1920-r.x-r.w,r.h)}
// ---- vista previa en vivo de la entrada de video (mejor esfuerzo: requiere la API tvwindow de Samsung)
var pvKey="",pvT=0;
function stopPreview(){clearTimeout(pvT);if(!pvKey)return;pvKey="";try{tizen.tvwindow.hide(function(){},function(){},"MAIN")}catch(e){}
 setHole(null);var e=document.querySelector(".live");if(e)e.classList.remove("live")}
function updatePreview(){var it=tiles[1]&&tiles[1][1];
 if(!(PREVIEW&&it&&cur===it&&it.t.src&&mode=="home")){stopPreview();return}
 var s=it.t.src;if(pvKey==s.n)return;stopPreview();pvKey=s.n;
 pvT=setTimeout(function(){var t=it.t,r={x:MARGIN+(t.c-1)*U,y:300+(t.r-1)*U,w:t.w*U-8,h:t.h*U-8},fail=function(){pvKey=""};
  try{tizen.tvwindow.setSource({type:s.type,number:s.num},function(){
   tizen.tvwindow.show(function(){setHole(r);it.el.classList.add("live")},fail,[r.x+"px",r.y+"px",r.w+"px",r.h+"px"],"MAIN")},fail,"MAIN")}catch(e){fail()}},650)}
// ---- YouTube en tendencia (opcional)
function loadYT(){if(!YT_KEY)return;var x=new XMLHttpRequest();
 x.open("GET","https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&maxResults=1&regionCode="+YT_REGION+"&key="+YT_KEY);
 x.onload=function(){try{var v=JSON.parse(x.responseText).items[0].snippet;BANNERS[1].img=v.thumbnails.high.url;BANNERS[1].title=v.title;
  var k=cur&&cur.kind=="tile"&&cur.p==1?cur.i:-1;buildPanel(1);if(k>=0)sel(tiles[1][k])}catch(e){}};x.send()}
init();setInterval(tick,15000);loadApps();loadYT();
</script></body></html>
